  <text x="80" y="438" font-size="13" font-weight="700" fill="#A85C3B">3 · MCP SERVERS (ตามหมวด)</text>
  <g>
    <!-- marketing -->
    <rect x="80" y="452" width="176" height="180" rx="12" fill="#FFFFFF" stroke="#E2725B" stroke-width="1.6"/>
    <text x="168" y="478" text-anchor="middle" font-size="14" font-weight="700" fill="#8C3B22">📢 การตลาด</text>
    <text x="168" y="497" text-anchor="middle" font-size="11" fill="#A85C3B">T2–T3 · 8 tools</text>
    <text x="96" y="522" font-size="11.5" fill="#5B3A2E">AdCreative AI</text>
    <text x="96" y="542" font-size="11.5" fill="#5B3A2E">Google / Meta Ads</text>
    <text x="96" y="562" font-size="11.5" fill="#5B3A2E">Adpliot</text>
    <text x="96" y="582" font-size="11.5" fill="#5B3A2E">A/B Testing</text>
    <text x="96" y="602" font-size="11.5" fill="#5B3A2E">Adlogy</text>

    <!-- development -->
    <rect x="268" y="452" width="176" height="180" rx="12" fill="#FFFFFF" stroke="#E2725B" stroke-width="1.6"/>
    <text x="356" y="478" text-anchor="middle" font-size="14" font-weight="700" fill="#8C3B22">🧩 พัฒนา</text>
    <text x="356" y="497" text-anchor="middle" font-size="11" fill="#A85C3B">T3 · 8 tools</text>
    <text x="284" y="522" font-size="11.5" fill="#5B3A2E">GitHub / GitLab</text>
    <text x="284" y="542" font-size="11.5" fill="#5B3A2E">API / GraphQL</text>
    <text x="284" y="562" font-size="11.5" fill="#5B3A2E">Docker / K8s</text>
    <text x="284" y="582" font-size="11.5" fill="#5B3A2E">Security / Scan</text>
    <text x="284" y="602" font-size="11.5" fill="#5B3A2E">Terminal / Shell</text>

    <!-- data -->
    <rect x="456" y="452" width="176" height="180" rx="12" fill="#FFFFFF" stroke="#E2725B" stroke-width="1.6"/>
    <text x="544" y="478" text-anchor="middle" font-size="14" font-weight="700" fill="#8C3B22">📊 ข้อมูล</text>
    <text x="544" y="497" text-anchor="middle" font-size="11" fill="#A85C3B">T2–T3 · 7 tools</text>
    <text x="472" y="522" font-size="11.5" fill="#5B3A2E">Airtable</text>
    <text x="472" y="542" font-size="11.5" fill="#5B3A2E">Postgres / Redis</text>
    <text x="472" y="562" font-size="11.5" fill="#5B3A2E">S3 / Storage</text>
    <text x="472" y="582" font-size="11.5" fill="#5B3A2E">Search / RAG</text>
    <text x="472" y="602" font-size="11.5" fill="#5B3A2E">Alerts</text>

    <!-- collaboration -->
    <rect x="644" y="452" width="176" height="180" rx="12" fill="#FFFFFF" stroke="#E2725B" stroke-width="1.6"/>
    <text x="732" y="478" text-anchor="middle" font-size="14" font-weight="700" fill="#8C3B22">🔗 ทำงานร่วม</text>
    <text x="732" y="497" text-anchor="middle" font-size="11" fill="#A85C3B">T1–T2 · 8 tools</text>
    <text x="660" y="522" font-size="11.5" fill="#5B3A2E">Notion</text>
    <text x="660" y="542" font-size="11.5" fill="#5B3A2E">Slack / Discord</text>
    <text x="660" y="562" font-size="11.5" fill="#5B3A2E">Calendar / Task</text>
    <text x="660" y="582" font-size="11.5" fill="#5B3A2E">Email / Drive</text>
    <text x="660" y="602" font-size="11.5" fill="#5B3A2E">Team / HR</text>

    <!-- ai core -->
    <rect x="832" y="452" width="188" height="180" rx="12" fill="#F7CDBB" stroke="#C1502E" stroke-width="1.8"/>
    <text x="926" y="478" text-anchor="middle" font-size="14" font-weight="700" fill="#8C3B22">🤖 แกนกลาง AI</text>
    <text x="926" y="497" text-anchor="middle" font-size="11" fill="#A85C3B">T2 · T4 · 8 tools</text>
    <text x="848" y="522" font-size="11.5" fill="#5B3A2E">AgentMcp / Mesh</text>
    <text x="848" y="542" font-size="11.5" fill="#5B3A2E">LangChain</text>
    <text x="848" y="562" font-size="11.5" fill="#5B3A2E">Model / Embedding</text>
    <text x="848" y="582" font-size="11.5" fill="#5B3A2E">Context / Memory</text>
    <text x="848" y="602" font-size="11.5" font-weight="700" fill="#8C3B22">MCP Gateway / Auth (T4)</text>
  </g>

  <line x1="550" y1="632" x2="550" y2="700" stroke="#C1502E" stroke-width="2.2" marker-end="url(#arrow)"/>

  <!-- layer 4: external -->
  <text x="80" y="686" font-size="13" font-weight="700" fill="#A85C3B">4 · EXTERNAL SYSTEMS</text>
  <g>
    <rect x="80"  y="700" width="296" height="62" rx="12" fill="#FFFFFF" stroke="#E2725B" stroke-width="1.5"/>
    <text x="228" y="727" text-anchor="middle" font-size="14" font-weight="600" fill="#8C3B22">SaaS &amp; APIs</text>
    <text x="228" y="747" text-anchor="middle" font-size="11.5" fill="#A85C3B">Ads, Notion, Slack, Drive</text>

    <rect x="402" y="700" width="296" height="62" rx="12" fill="#FFFFFF" stroke="#E2725B" stroke-width="1.5"/>
    <text x="550" y="727" text-anchor="middle" font-size="14" font-weight="600" fill="#8C3B22">Datastores</text>
    <text x="550" y="747" text-anchor="middle" font-size="11.5" fill="#A85C3B">Postgres, Redis, S3</text>

    <rect x="724" y="700" width="296" height="62" rx="12" fill="#FFFFFF" stroke="#E2725B" stroke-width="1.5"/>
    <text x="872" y="727" text-anchor="middle" font-size="14" font-weight="600" fill="#8C3B22">Models &amp; Runtimes</text>
    <text x="872" y="747" text-anchor="middle" font-size="11.5" fill="#A85C3B">LLM, Embedding, K8s</text>
  </g>

  <!-- legend -->
  <line x1="80" y1="788" x2="1020" y2="788" stroke="#E8B79C" stroke-width="1.2"/>
  <g font-size="11.5" fill="#A85C3B">
    <rect x="80" y="798" width="14" height="14" rx="3" fill="#FFFFFF" stroke="#E2725B"/>
    <text x="100" y="810">องค์ประกอบ</text>
    <rect x="200" y="798" width="14" height="14" rx="3" fill="#FBDFD3" stroke="#C1502E"/>
    <text x="220" y="810">จุดควบคุมความปลอดภัย</text>
    <text x="430" y="810">T1 อ่านสาธารณะ · T2 อ่านภายใน · T3 เขียน/รัน · T4 จัดการสิทธิ์</text>
  </g>
</svg>
