  <text x="550" y="298" text-anchor="middle" font-size="17" font-weight="700" fill="#8C3B22">MCP Gateway — จุดควบคุมความปลอดภัยจุดเดียว</text>

  <g>
    <rect x="108" y="316" width="204" height="52" rx="10" fill="#FFFFFF" stroke="#E2725B" stroke-width="1.4"/>
    <text x="210" y="340" text-anchor="middle" font-size="14" font-weight="600" fill="#8C3B22">Auth</text>
    <text x="210" y="357" text-anchor="middle" font-size="11" fill="#A85C3B">ยืนยันตัวตน / token</text>

    <rect x="328" y="316" width="204" height="52" rx="10" fill="#FFFFFF" stroke="#E2725B" stroke-width="1.4"/>
    <text x="430" y="340" text-anchor="middle" font-size="14" font-weight="600" fill="#8C3B22">Scope</text>
    <text x="430" y="357" text-anchor="middle" font-size="11" fill="#A85C3B">จำกัดสิทธิ์ตาม Tier</text>

    <rect x="548" y="316" width="204" height="52" rx="10" fill="#FFFFFF" stroke="#E2725B" stroke-width="1.4"/>
    <text x="650" y="340" text-anchor="middle" font-size="14" font-weight="600" fill="#8C3B22">Redaction</text>
    <text x="650" y="357" text-anchor="middle" font-size="11" fill="#A85C3B">ปิดบังคีย์/ข้อมูลลับ</text>

    <rect x="768" y="316" width="224" height="52" rx="10" fill="#FFFFFF" stroke="#E2725B" stroke-width="1.4"/>
    <text x="880" y="340" text-anchor="middle" font-size="14" font-weight="600" fill="#8C3B22">Audit / Rate-limit</text>
    <text x="880" y="357" text-anchor="middle" font-size="11" fill="#A85C3B">บันทึก + จำกัดอัตรา</text>
  </g>

  <line x1="550" y1="386" x2="550" y2="452" stroke="#C1502E" stroke-width="2.2" marker-end="url(#arrow)"/>

