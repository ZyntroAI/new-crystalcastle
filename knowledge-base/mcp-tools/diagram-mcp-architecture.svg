<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 820" width="1100" height="820" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans Thai', sans-serif" role="img" aria-labelledby="title desc">
  <title id="title">สถาปัตยกรรม MCP Gateway → MCP Servers</title>
  <desc id="desc">แผนภาพแสดงเส้นทางจาก AI Clients ผ่าน MCP Gateway ที่ทำหน้าที่ Auth/Scope/Redaction/Audit ไปยัง MCP Servers 5 หมวด แล้วออกไปยังระบบภายนอก</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFF7F1"/>
      <stop offset="1" stop-color="#FDECE3"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#C1502E"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1100" height="820" fill="url(#bg)"/>

  <!-- header -->
  <text x="550" y="46" text-anchor="middle" font-size="26" font-weight="700" fill="#8C3B22">MCP Gateway → MCP Servers</text>
  <text x="550" y="72" text-anchor="middle" font-size="14" fill="#A85C3B">สถาปัตยกรรมการประสานงาน · อ้างอิง OWASP LLM Top 10 &amp; AST Tiering (T1–T4)</text>
  <line x1="80" y1="90" x2="1020" y2="90" stroke="#E8B79C" stroke-width="1.5"/>

  <!-- layer 1: clients -->
  <text x="80" y="128" font-size="13" font-weight="700" fill="#A85C3B">1 · AI CLIENTS</text>
  <g>
    <rect x="80"  y="140" width="290" height="60" rx="12" fill="#FFFFFF" stroke="#E2725B" stroke-width="1.6"/>
    <text x="225" y="167" text-anchor="middle" font-size="15" font-weight="600" fill="#8C3B22">Claude Desktop / IDE Agent</text>
    <text x="225" y="187" text-anchor="middle" font-size="12" fill="#A85C3B">ผู้ใช้ทั่วไป · T1–T2</text>

    <rect x="405" y="140" width="290" height="60" rx="12" fill="#FFFFFF" stroke="#E2725B" stroke-width="1.6"/>
    <text x="550" y="167" text-anchor="middle" font-size="15" font-weight="600" fill="#8C3B22">CrystalCastleX Agent</text>
    <text x="550" y="187" text-anchor="middle" font-size="12" fill="#A85C3B">ออร์เคสเตรเตอร์ · T2–T3</text>

    <rect x="730" y="140" width="290" height="60" rx="12" fill="#FFFFFF" stroke="#E2725B" stroke-width="1.6"/>
    <text x="875" y="167" text-anchor="middle" font-size="15" font-weight="600" fill="#8C3B22">Automation / Cron</text>
    <text x="875" y="187" text-anchor="middle" font-size="12" fill="#A85C3B">งานอัตโนมัติ · T3</text>
  </g>

  <line x1="225" y1="200" x2="225" y2="268" stroke="#C1502E" stroke-width="1.8" marker-end="url(#arrow)"/>
  <line x1="550" y1="200" x2="550" y2="268" stroke="#C1502E" stroke-width="1.8" marker-end="url(#arrow)"/>
  <line x1="875" y1="200" x2="875" y2="268" stroke="#C1502E" stroke-width="1.8" marker-end="url(#arrow)"/>

  <!-- layer 2: gateway -->
  <text x="80" y="252" font-size="13" font-weight="700" fill="#A85C3B">2 · MCP GATEWAY / AUTH (T4)</text>
