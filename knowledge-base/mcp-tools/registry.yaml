  - name: Todo / Reminder
    category: collaboration
    tier: T1
    status: ready
    permissions: [read:tasks, write:tasks]
    redact: [api_key]
  - name: Team / HR
    category: collaboration
    tier: T1
    status: ready
    permissions: [read:users, read:roles]
    redact: [api_key, admin_token]
  - name: Doc / Note
    category: collaboration
    tier: T1
    status: ready
