  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);
    font:15px/1.5 ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans Thai",sans-serif}
  header{padding:28px 22px 18px;border-bottom:1px solid var(--line);
    background:linear-gradient(180deg,#111e38,#0f172a)}
  h1{margin:0 0 6px;font-size:22px}
  .sub{color:var(--muted);font-size:13px}
  .wrap{max-width:1180px;margin:0 auto;padding:20px 22px 60px}
  .stats{display:flex;gap:12px;flex-wrap:wrap;margin:18px 0}
  .stat{background:var(--panel);border:1px solid var(--line);border-radius:12px;
    padding:12px 16px;min-width:120px}
  .stat b{display:block;font-size:22px}
  .stat span{color:var(--muted);font-size:12px}
  .controls{display:flex;gap:10px;flex-wrap:wrap;margin:16px 0 22px}
  input[type=search],select{background:var(--panel);color:var(--text);
    border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:14px}
  input[type=search]{flex:1;min-width:220px}
  .chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}
  .chip{cursor:pointer;user-select:none;background:var(--panel);border:1px solid var(--line);
    border-radius:999px;padding:6px 13px;font-size:13px;color:var(--muted)}
  .chip.on{background:#312e81;border-color:var(--accent);color:#e0e7ff}
  .grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(320px,1fr))}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;
    transition:border-color .15s,transform .15s}
  .card:hover{border-color:var(--accent);transform:translateY(-2px)}
  .card h3{margin:0 0 8px;font-size:16px;display:flex;align-items:center;gap:8px}
  .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
  .badge{border-radius:999px;padding:3px 10px;font-size:11.5px;font-weight:600;
    border:1px solid transparent}
  .t1{background:#052e16;color:var(--t1);border-color:#166534}
  .t2{background:#3b3005;color:var(--t2);border-color:#854d0e}
  .t3{background:#431407;color:var(--t3);border-color:#9a3412}
  .t4{background:#450a0a;color:var(--t4);border-color:#991b1b}
  .ok{background:#052e16;color:#4ade80;border-color:#166534}
  .cat{background:var(--panel-2);color:var(--muted);border-color:var(--line)}
  .label{color:var(--muted);font-size:12px;margin:10px 0 5px}
  .tags{display:flex;gap:6px;flex-wrap:wrap}
  .tag{background:var(--panel-2);border:1px solid var(--line);border-radius:8px;
    padding:3px 8px;font-size:11.5px;color:#cbd5e1;font-family:ui-monospace,monospace}
  .tag.redact{color:#fca5a5;border-color:#7f1d1d}
  .empty{color:var(--muted);padding:40px 0;text-align:center}
  footer{color:var(--muted);font-size:12px;border-top:1px solid var(--line);
    padding:16px 22px;text-align:center}
  a{color:var(--accent)}
</style>
</head>

const {meta, tools} = DATA;
const $ = (s)=>document.querySelector(s);

/* stats */
$('#stats').innerHTML = `
  <div class="stat"><b>${meta.total}</b><span>เครื่องมือทั้งหมด</span></div>
  <div class="stat"><b>${meta.categories.length}</b><span>หมวด</span></div>
  <div class="stat"><b>${tools.filter(t=>t.tier==='T3'||t.tier==='T4').length}</b><span>ความเสี่ยงสูง (T3–T4)</span></div>
  <div class="stat"><b>${tools.reduce((n,t)=>n+t.redact.length,0)}</b><span>ฟิลด์ที่ต้องปิดบัง</span></div>`;
$('#upd').textContent = meta.updated;

/* filters */
$('#tier').insertAdjacentHTML('beforeend',
  [...new Set(tools.map(t=>t.tier))].sort().map(t=>`<option value="${t}">${t}</option>`).join(''));
$('#cat').insertAdjacentHTML('beforeend',
  meta.categories.map(c=>`<option value="${c.id}">${c.emoji} ${c.title}</option>`).join(''));

let activeCat = '';
$('#chips').innerHTML = `<span class="chip on" data-cat="">ทั้งหมด</span>` +
  meta.categories.map(c=>`<span class="chip" data-cat="${c.id}">${c.emoji} ${c.title} (${c.count})</span>`).join('');
$('#chips').addEventListener('click', e=>{
  const chip = e.target.closest('.chip'); if(!chip) return;
  activeCat = chip.dataset.cat;
  document.querySelectorAll('.chip').forEach(c=>c.classList.toggle('on', c===chip));
  render();
});
$('#q').addEventListener('input', render);
$('#tier').addEventListener('change', render);
$('#cat').addEventListener('change', ()=>{ activeCat=''; 
  document.querySelectorAll('.chip').forEach(c=>c.classList.toggle('on', c.dataset.cat==='')); render(); });

function render(){
  const q = $('#q').value.trim().toLowerCase();
  const tier = $('#tier').value;
  const catSel = $('#cat').value;
  const list = tools.filter(t=>{
    if(activeCat && t.category!==activeCat) return false;
    if(catSel && t.category!==catSel) return false;
    if(tier && t.tier!==tier) return false;
    if(q){
      const hay = [t.name,t.categoryTitle,t.tier,...t.permissions,...t.redact].join(' ').toLowerCase();
      if(!hay.includes(q)) return false;
    }
    return true;
  });
  $('#grid').innerHTML = list.map(t=>`
    <div class="card">
      <h3>${t.emoji} ${t.name}</h3>
      <div class="row">
        <span class="badge ${t.tierClass}">${t.tier} · ${t.tierName}</span>
        <span class="badge ok">✅ ${t.status}</span>
        <span class="badge cat">${t.categoryTitle}</span>
      </div>
      <div class="label">สิทธิ์ (permissions)</div>
      <div class="tags">${t.permissions.map(p=>`<span class="tag">${p}</span>`).join('')}</div>
      <div class="label">ปิดบังเมื่อบันทึก (redact)</div>
      <div class="tags">${t.redact.map(r=>`<span class="tag redact">${r}</span>`).join('')}</div>
    </div>`).join('');
  $('#empty').style.display = list.length ? 'none' : 'block';
}
render();
</script>
