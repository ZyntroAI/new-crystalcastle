version: "3.8"

name: crystalcastle-api

services:
  # ==========================================
  # 🚀 FastAPI Application
  # ==========================================
  api:
    build:
      context: .
      target: runtime
    container_name: crystalcastle-api
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=production
      - DEBUG=false
      - PORT=8000
    volumes:
      - ./logs:/app/logs
      - ./data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s
    networks:
      - crystalcastle-network

  # ==========================================
  # 🗄️  PostgreSQL (ทางเลือก)
  # ==========================================
  db:
    image: postgres:15-alpine
    container_name: crystalcastle-db
    environment:
      - POSTGRES_USER=crystalcastle
      - POSTGRES_PASSWORD=change_me_in_production
      - POSTGRES_DB=crystalcastle
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crystalcastle"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - crystalcastle-network
    profiles: ["with-db"]

  # ==========================================
  # 🧹 pgAdmin — จัดการฐานข้อมูล (ทางเลือก)
  # ==========================================
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: crystalcastle-pgadmin
    environment:
      - PGADMIN_DEFAULT_EMAIL=admin@example.com
      - PGADMIN_DEFAULT_PASSWORD=change_me_in_production
    ports:
      - "5050:80"
    depends_on:
      - db
    restart: unless-stopped
    networks:
      - crystalcastle-network
    profiles: ["with-db"]

networks:
  crystalcastle-network:
    driver: bridge

volumes:
  postgres-data:
