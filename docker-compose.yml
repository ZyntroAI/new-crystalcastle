version: "3.8"

services:
  # 🚀 FastAPI Backend — API หลัก
  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: crystalcastle-api
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      PYTHONPATH: /app
      PYTHONDONTWRITEBYTECODE: 1
      PYTHONUNBUFFERED: 1
    volumes:
      - ./backend:/app:ro
      - ./uploads:/app/uploads:rw
      - ./Vault:/app/Vault:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:8000/health').raise_for_status()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    depends_on:
      - db
    networks:
      - crystalcastle-network

  # 🗄️ PostgreSQL — ฐานข้อมูล
  db:
    image: postgres:16-alpine
    container_name: crystalcastle-db
    environment:
      POSTGRES_USER: ${DB_USER:-crystalcastle}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-changeme}
      POSTGRES_DB: ${DB_NAME:-crystalcastle}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-crystalcastle} -d ${DB_NAME:-crystalcastle}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - crystalcastle-network

  # 🎨 Frontend — Next.js (ตัวเลือก)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: crystalcastle-frontend
    ports:
      - "3000:3000"
    env_file:
      - .env
    depends_on:
      - api
    restart: unless-stopped
    networks:
      - crystalcastle-network
    profiles:
      - full  # รันเฉพาะเมื่อระบุ --profile full

networks:
  crystalcastle-network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
