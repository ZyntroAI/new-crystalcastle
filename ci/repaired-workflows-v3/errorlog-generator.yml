name: Error Log Generator

on:
  push:
    branches:
      - main
      - patch-*
    paths:
      - 'scripts/errorlog-generator/**'
      - '.github/workflows/errorlog-generator.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'scripts/errorlog-generator/**'
  workflow_dispatch:

jobs:
  generate-error-logs:
    name: Generate Error Logs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install dependencies
        working-directory: scripts/errorlog-generator
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run error log generator
        working-directory: scripts/errorlog-generator
        run: python errorlog_generator.py

      - name: Upload logs as artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: error-logs
          path: scripts/errorlog-generator/logs/
          retention-days: 30

      - name: Notify on failure
        if: failure()
        run: echo "Error log generation failed"

      - name: Notify on success
        if: success()
        run: echo "Error logs generated successfully"
