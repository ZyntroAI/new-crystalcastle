name: Secret Scan

# Scans for committed credentials with gitleaks.
#
# Two modes, deliberately different:
#
#   GATE      scans only the commits this push/PR introduces. A finding fails
#             the job. This is the blocking check.
#   ADVISORY  scans the entire history. It never fails the job — this
#             repository has 30 pre-existing findings (see SECURITY.md) and a
#             blocking full-history gate would be red on every run from day one,
#             which is how real gates get disabled.
#
# Everything is pinned: actions to full commit SHAs, the scanner to a version
# AND a sha256 of its release tarball. No third-party action is used to fetch
# gitleaks, so there is no unpinned supply-chain surface.
#
# All run steps use `shell: sh` (POSIX). Nothing here needs bash.

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  schedule:
    # Weekly full-history sweep, Mondays 03:17 UTC. Catches drift in history
    # that no push-triggered range scan would ever look at again.
    - cron: "17 3 * * 1"
  workflow_dispatch:

# Least privilege: we only read code and upload an artifact. No write scope.
permissions:
  contents: read

concurrency:
  # Supersede in-flight runs for the same ref; a newer push is the one that
  # matters. Never cancel on main, so the full-history sweep always completes.
  group: secret-scan-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  # Scanner pinned by version + tarball sha256. Update both together.
  GITLEAKS_VERSION: "8.30.1"
  GITLEAKS_X64_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
  GITLEAKS_ARM64_SHA256: "e4a487ee7ccd7d3a7f7ec08657610aa3606637dab924210b3aee62570fb4b080"

jobs:
  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      # Pinned: actions/checkout v7.0.1
      # fetch-depth 0 is required — gitleaks resolves real git ranges, which
      # needs the commits, not just the working tree.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install gitleaks
        shell: sh
        run: |
          set -eu
          ARCH="$(uname -m)"
          case "$ARCH" in
            x86_64|amd64)  GL_ARCH="x64";   GL_SHA="$GITLEAKS_X64_SHA256" ;;
            aarch64|arm64) GL_ARCH="arm64"; GL_SHA="$GITLEAKS_ARM64_SHA256" ;;
            *) echo "Unsupported architecture: $ARCH" >&2; exit 2 ;;
          esac
          echo "Architecture $ARCH -> $GL_ARCH"

          TARBALL="gitleaks_${GITLEAKS_VERSION}_linux_${GL_ARCH}.tar.gz"
          URL="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${TARBALL}"

          mkdir -p "$RUNNER_TEMP/gl"
          curl -sSL --fail --retry 3 --retry-delay 2 --max-time 120 \
            -o "$RUNNER_TEMP/gl/$TARBALL" "$URL"

          # Fail closed: a bad or tampered download must never be executed.
          echo "${GL_SHA}  $RUNNER_TEMP/gl/${TARBALL}" | sha256sum --check --strict -

          tar -xzf "$RUNNER_TEMP/gl/$TARBALL" -C "$RUNNER_TEMP/gl" gitleaks
          chmod +x "$RUNNER_TEMP/gl/gitleaks"
          "$RUNNER_TEMP/gl/gitleaks" version

      # Resolve the commit range and expose it to later steps. Handles both
      # event shapes and the all-zeros "before" of a brand-new branch.
      - name: Resolve commit range
        id: range
        shell: sh
        env:
          EVENT_NAME: ${{ github.event_name }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.event.after }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -eu
          ZERO="0000000000000000000000000000000000000000"

          if [ "$EVENT_NAME" = "pull_request" ]; then
            BEFORE="$PR_BASE"
            AFTER="$PR_HEAD"
          else
            BEFORE="$PUSH_BEFORE"
            AFTER="$PUSH_AFTER"
          fi

          [ -n "$AFTER" ] || AFTER="$HEAD_SHA"

          if [ -n "$BEFORE" ] && [ "$BEFORE" != "$ZERO" ]; then
            LOG_OPTS="$BEFORE..$AFTER"
            MODE="range"
          else
            # New branch, or an event with no usable base: scan the tip commit.
            LOG_OPTS="-1 $AFTER"
            MODE="single"
          fi

          echo "mode=$MODE"
          echo "log_opts=$LOG_OPTS"
          echo "log_opts=$LOG_OPTS" >> "$GITHUB_OUTPUT"
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"

      # THE GATE. Fails the job on any credential introduced by this change.
      # --redact keeps the secret value out of logs and out of the artifact.
      - name: Scan new commits (gate)
        id: gate
        shell: sh
        run: |
          set -eu
          echo "Scanning range: ${{ steps.range.outputs.log_opts }}"
          set +e
          "$RUNNER_TEMP/gl/gitleaks" detect \
            --source . \
            --redact \
            --no-banner \
            --log-opts="${{ steps.range.outputs.log_opts }}" \
            --report-format json \
            --report-path "$RUNNER_TEMP/gitleaks-new.json" \
            --exit-code 1
          RC=$?
          set -e

          if [ "$RC" -ne 0 ]; then
            echo "::error::gitleaks found credentials in the commits this change adds."
            echo "See the 'gitleaks-new' artifact and SECURITY.md for the rotation process."
          else
            echo "No credentials found in the scanned range."
          fi
          exit "$RC"

      # ADVISORY. Never fails the build. Gives an honest running count of
      # findings already in history so the backlog stays visible.
      - name: Full-history audit (advisory)
        if: always()
        shell: sh
        run: |
          set -eu
          set +e
          "$RUNNER_TEMP/gl/gitleaks" detect \
            --source . \
            --redact \
            --no-banner \
            --report-format json \
            --report-path "$RUNNER_TEMP/gitleaks-history.json" \
            --exit-code 0
          set -e

          if [ -f "$RUNNER_TEMP/gitleaks-history.json" ]; then
            COUNT="$(grep -o '"RuleID"' "$RUNNER_TEMP/gitleaks-history.json" | wc -l | tr -d ' ')"
          else
            COUNT=0
          fi

          {
            echo "### Secret scan"
            echo ""
            echo "| Scope | Result |"
            echo "| ----- | ------ |"
            echo "| New commits (gate) | \`${{ steps.range.outputs.mode }}\` scan of \`${{ steps.range.outputs.log_opts }}\` |"
            echo "| Full history (advisory) | ${COUNT} finding(s) already in history |"
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$COUNT" -gt 0 ]; then
            echo "::warning::${COUNT} historical finding(s) remain. These are tracked in SECURITY.md and require credential rotation — a code change alone cannot clear them."
          fi

      - name: Upload reports
        if: always()
        # Pinned: actions/upload-artifact v7.0.1
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          # 7-day retention: enough to investigate, short enough to limit copies.
          name: gitleaks-reports
          path: |
            ${{ runner.temp }}/gitleaks-new.json
            ${{ runner.temp }}/gitleaks-history.json
          retention-days: 7
          if-no-files-found: ignore
