name: Deploy to Dev

on:
  push:
    branches:
      - main
      - pure-agent-dev
      - agent-hub
      - crystalcastle
      - 1napz
  workflow_dispatch:

env:
  IMAGE_NAME: my-app
  REGISTRY: ghcr.io/${{ github.repository_owner }}
  NAMESPACE: dev

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f  # v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9  # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051  # v5
        with:
          images: \( {{ env.REGISTRY }}/ \){{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=raw,value=dev
            type=sha

      - name: Build and push Docker image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8  # v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Set up kubectl
        uses: azure/setup-kubectl@776406bce94f63e41d621b960d78ee25c8b76ede  # v4
        with:
          version: 'latest'

      - name: Configure kubeconfig
        run: |
          echo "${{ secrets.KUBE_CONFIG_DEV }}" | base64 -d > $HOME/.kube/config
          chmod 600 $HOME/.kube/config

      - name: Deploy to Dev namespace
        run: |
          kubectl apply -k k8s/overlays/dev

      - name: Wait for rollout & health check
        run: |
          kubectl rollout status deployment/app -n ${{ env.NAMESPACE }} --timeout=180s
          if [ $? -ne 0 ]; then
            echo "❌ Rollout failed → rolling back..."
            kubectl rollout undo deployment/app -n ${{ env.NAMESPACE }}
            exit 1
          fi
          echo "✅ Deployment to Dev succeeded"

      - name: Notify success
        if: success()
        run: |
          echo "Deployed commit ${{ github.sha }} to Dev successfully"
