# .github/workflows/deploy-dev.yml
name: Deploy to Dev

on:
  push:
    branches:
      - main
  workflow_dispatch:   # อนุญาตให้กดรันมือได้ด้วย

env:
  IMAGE_NAME: my-app
  REGISTRY: ghcr.io/${{ github.repository_owner }}
  NAMESPACE: dev

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write          # สำหรับ push ไป GitHub Container Registry
      id-token: write         # ถ้าใช้ OIDC กับ cloud

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: \( {{ env.REGISTRY }}/ \){{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=
            type=raw,value=latest
            type=raw,value=dev

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: 'latest'

      - name: Configure kubeconfig
        run: |
          # ตัวอย่างสำหรับ GKE / EKS / AKS หรือ self-managed
          # ปรับตาม cloud ที่คุณใช้
          echo "${{ secrets.KUBE_CONFIG_DEV }}" | base64 -d > $HOME/.kube/config
          chmod 600 $HOME/.kube/config

      - name: Deploy to Dev namespace
        run: |
          # ใช้ Kustomize overlay
          kubectl apply -k k8s/overlays/dev

          # หรือถ้าใช้ Helm
          # helm upgrade --install my-app ./helm/app \
          #   --namespace ${{ env.NAMESPACE }} \
          #   --create-namespace \
          #   --set image.repository=\( {{ env.REGISTRY }}/ \){{ env.IMAGE_NAME }} \
          #   --set image.tag=${{ github.sha }} \
          #   --wait

      - name: Wait for rollout & health check
        run: |
          kubectl rollout status deployment/app -n ${{ env.NAMESPACE }} --timeout=180s

          # ถ้า rollout ล้มเหลว → rollback อัตโนมัติ
          if [ $? -ne 0 ]; then
            echo "❌ Rollout failed → rolling back..."
            kubectl rollout undo deployment/app -n ${{ env.NAMESPACE }}
            exit 1
          fi

          echo "✅ Deployment to Dev succeeded"

      - name: Notify success (optional)
        if: success()
        run: |
          echo "Deployed commit ${{ github.sha }} to Dev successfully"
          # สามารถใส่ Slack / Discord / Teams notification ได้ที่นี่
