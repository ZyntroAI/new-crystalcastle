  # ======================================================
  # 🐳 Job 5: Docker Build & Image Security Scan
  # ======================================================
  docker-build-scan:
    name: 🐳 Docker Build & Scan
    runs-on: ubuntu-latest
    needs: [security-scan]  # รอความปลอดภัยผ่านก่อนสร้างภาพ
    if: github.event_name == 'pull_request'

    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      - name: � Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 🔑 Login to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 🏷️ Prepare Image Metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/new-crystalcastle
          tags: |
            type=ref,event=branch
            type=sha,prefix=,format=long

      - name: 📦 Build Docker Image (Dry Run — No Push)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          target: production
          load: true  # โหลดขึ้นเครื่องเพื่อสแกน
          push: false # ยังไม่ส่ง — รอ Merge
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 🔍 Scan Image for Vulnerabilities (Trivy)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ghcr.io/${{ github.repository }}/new-crystalcastle:${{ github.sha }}
          scan-type: image
          scanners: vuln
          severity: CRITICAL,HIGH
          exit-code: "1"  # ❌ ถ้าพบปัญหาระดับสูง
          format: table

      - name: 📋 Generate Scan Summary
        if: always()
        run: |
          cat << EOF >> $GITHUB_STEP_SUMMARY
          ### 🐳 Docker Build & Scan — Result
          - **Status:** ${{ job.status == 'success' && '✅ Passed' || '⚠️ Review Needed' }}
          - **Image:** ghcr.io/${{ github.repository }}/new-crystalcastle@sha256:${{ github.sha }}
          - **Registry:** GitHub Container Registry
          - **Scan:** Trivy · Critical/High Severity Block
          - **Push:** ⏳ Held — Will release on merge to main
          EOF
