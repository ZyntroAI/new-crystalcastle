name: FastAPI CI

run-name: CI • ${{ github.head_ref || github.ref_name }} • ${{ github.sha }}

# ========== ทริกเกอร์ — ไม่กรองไฟล์เกินไป ✅ ==========
on:
  push:
    branches:
      - main
      - develop
    paths-ignore: 
      - 'Projects/**'
  pull_request:
    branches:
      - main
      - develop
    paths-ignore: 
      - 'Projects/**'  
  permissions:
    contents: read
    checks: write
    pull-requests: write

  concurrency:
   group: ${{ github.workflow }}-$        {{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Run Tests & Upload Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@4.1.1
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: 🐍 Set up Python 3.12
        uses: actions/setup-python@v5.1.0
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: 📦 Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -r requirements.txt
          pip install pytest pytest-cov ruff black

      - name: 🧹 Lint & Format
        working-directory: backend
        run: |
          ruff check .
          black --check .

      - name: 🧪 Run tests with coverage
        working-directory: backend
        run: |
          pytest tests/ --cov=app \
            --cov-report=term \
            --cov-report=xml:coverage.xml \
            --cov-fail-under=70
        env:
          PYTHONPATH: ${{ github.workspace }}/backend

      - name: 📤 Upload coverage report
        uses: actions/upload-artifact@4.4.3
        with:
          name: coverage-report
          path: backend/coverage.xml
          retention-days: 7
        if: always()

  
  docs:
    name: Markdown & Docs Check
    runs-on: ubuntu-latest
    timeout-minutes: 3
    if: |
      contains(github.event.pull_request.files.*.filename, '.md') ||
      contains(github.event_name, 'push')

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@4.1.1
        with:
          fetch-depth: 0

      - name: ✅ Markdown Lint
        uses: actions/setup-node@v4.0.0
        with:
          node-version: '20'
      - run: npm install -g markdownlint-cli
      - run: markdownlint '**/*.md' --ignore node_modules

  
  summary:
    name: CI Status
    runs-on: ubuntu-latest
    needs: [test, docs]
    if: always()
    steps:
      - name: ✅ All checks passed
        run: |
          echo "✅ CI Complete — Ready to merge"
