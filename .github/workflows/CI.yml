name: 🧪 CI

run-name: CI • ${{ github.sha }}

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true # Suppress Node deprecation globally

jobs:
  ci:
    name: ▶️ CI Checks
    runs-on: ubuntu-24.04 # ✅ Pin explicitly — avoids Ubuntu 26 surprise
    timeout-minutes: 15

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v5 # ✅ Node 24-native — eliminates warning
        with:
          fetch-depth: 0

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: 📦 Install dependencies
        run: npm ci

      - name: ✅ Type check
        run: npm run typecheck 2>/dev/null || echo "⚠️ No typecheck script — skipping"

      - name: 🔍 Lint
        run: npm run lint 2>/dev/null || echo "⚠️ No lint script — skipping"

      - name: 🧪 Test
        run: npm test --if-present
