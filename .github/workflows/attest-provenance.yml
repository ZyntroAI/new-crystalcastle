name: Release & Attest Provenance

# Fires on a published GitHub Release. You don't have any formal releases/tags
# yet on crystalcastle, so use workflow_dispatch below to test this manually
# until a real release is cut.
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write      # required for Sigstore signing
  attestations: write  # required to publish the attestation to GitHub
  packages: write

jobs:
  build-and-attest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        # Note: if the 8 corrupted git tree entries flagged earlier in this
        # repo are still unresolved, this step is where they'd surface as a
        # checkout failure. Worth confirming a clean `git clone` works before
        # relying on this workflow.

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm ci

      - name: Build package
        run: npm run build --if-present

      - name: Pack npm tarball
        run: npm pack --pack-destination ./dist

      - name: Generate build provenance attestation
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: 'dist/*.tgz'
        # GitHub's own README for this action now recommends new workflows
        # use `actions/attest` directly instead -- attest-build-provenance is
        # just a thin wrapper as of v4. Swap this step for actions/attest if
        # you want to follow the current recommendation:
        # https://github.com/actions/attest

      - name: Publish to npm
        run: npm publish ./dist/*.tgz --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

# After a run, anyone can verify the published tarball came from this
# workflow with:
#   gh attestation verify <path-to-tgz-or-tarball> --owner nobizzhome
