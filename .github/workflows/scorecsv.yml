jobs:
  rubric-evaluate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Install deps (adjust to your stack)
      - name: Install
        run: npm ci

      # Run whatever generates scores.csv (adjust command)
      - name: Generate rubric scores
        run: npm run rubric:evaluate

      # Ensure the file exists at this path
      # (adjust paths to wherever your script outputs it)
      - name: Upload scores.csv artifact
        uses: actions/upload-artifact@v4
        with:
          name: scores-csv
          path: |
            ./scores.csv
          if-no-files-found: error
          retention-days: 30

        name: Upload rubric artifacts
        uses: actions/upload-artifact@v4
        with:
        name: scores-csv
        path: |
        ./scores.csv
        ./scores.json
        ./report.html
        if-no-files-found: error
  
