name: CI
 
on:
pull_request:
push:
branches:
- main
- develop
 
jobs:
test:
runs-on: ubuntu-latest
 
steps:
- uses: actions/checkout@v5
- uses: actions/setup-node@v5
with:
node-version: 22
 
- run: npm ci
- run: npm test --if-present
 
build:
runs-on: ubuntu-latest
 
steps:
- uses: actions/checkout@v5
- uses: actions/setup-node@v5
with:
node-version: 22
 
- run: npm ci
- run: npm run build
