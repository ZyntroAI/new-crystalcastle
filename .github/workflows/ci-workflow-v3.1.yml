  # ======================================================
  # 🐳 Job 5: Docker Build & Security Scan
  # ======================================================
  docker-build-scan:
    name: 🐳 Docker Build & Scan
    runs-on: ubuntu-latest
    needs: [security-scan]
    if: github.event_name == 'pull_request'

    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      - name: 🛠️ Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 🏷️ Prepare Image Metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/new-crystalcastle
          tags: |
            type=sha,format=long,prefix=
            type=pr,event=pr

      - name: 📦 Build Production Image (Multi-stage)
        uses: docker/build-push-action@v6
        id: build
        with:
          context: .
          file: ./Dockerfile
          target: production          # ตรงกับ Dockerfile: FROM base AS production
          load: true                  # โหลดขึ้นเครื่องเพื่อสแกน
          push: false                 # ยังไม่ส่ง — รอ Merge
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 🔍 Scan for Vulnerabilities (Trivy)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ghcr.io/${{ github.repository }}/new-crystalcastle:${{ github.sha }}
          scan-type: image
          scanners: vuln
          severity: CRITICAL,HIGH
          exit-code: "1"              # ❌ บล็อกถ้าพบอันตราย
          format: table

      - name: 📋 Build & Scan Summary
        if: always()
        run: |
          cat << EOF >> $GITHUB_STEP_SUMMARY
          ### 🐳 Docker Build & Scan — Result
          - **Target Stage:** \`production\` (Multi-stage)
          - **Image:** ghcr.io/${{ github.repository }}/new-crystalcastle@sha256:${{ github.sha }}
          - **Buildx:** Enabled · Caching via GitHub Actions
          - **Scan:** Trivy · Block: CRITICAL / HIGH
          - **Push Status:** ⏳ Pending — Will release to GHCR on merge to \`main\`
          - **.dockerignore:** Secrets & tests excluded ✅
          EOF
