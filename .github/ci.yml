name: CI

on:
  push:
    branches:
      - main
      - develop
      - master
      - dev
      - agent-hub
      - pure-agent-dev
      - crystal-dev
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type Check
        run: npm run typecheck --if-present

      - name: Unit Test
        run: npm test -- --runInBand

      - name: Build
        run: npm run build

      - name: Upload Build Artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: build-output
          path: |
            dist/
            build/
