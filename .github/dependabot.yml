version: 2
updates:
  # ------------------------------
  # 1. GitHub Actions
  # ------------------------------
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"       # ตรวจทุกสัปดาห์
      day: "sunday"            # วันอาทิตย์
      time: "03:00"            # เวลากลางคืน
      timezone: "Asia/Bangkok" # เวลาไทย
    open-pull-requests-limit: 10
    reviewers:
      - "ZyntroAI/devops"
    labels:
      - "dependencies"
      - "automerge"
    commit-message:
      prefix: "chore(actions)"
      include: "scope"
    groups:
      actions:
        patterns:
          - "actions/*"
          - "github/*"

  # ------------------------------
  # 2. Python / pip
  # ------------------------------
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "04:00"
      timezone: "Asia/Bangkok"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "python"
    commit-message:
      prefix: "chore(python)"
      include: "scope"
    # ไม่อัปเดตเวอร์ชันหลักที่เปลี่ยนพฤติกรรม
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  # ------------------------------
  # 3. npm / Node.js / React
  # ------------------------------
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "tuesday"
      time: "04:00"
      timezone: "Asia/Bangkok"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "javascript"
      - "frontend"
    commit-message:
      prefix: "chore(npm)"
      include: "scope"
    groups:
      frontend:
        patterns:
          - "react"
          - "react-dom"
          - "@types/react*"
          - "vite"
          - "@vitejs/*"
        exclude-patterns:
          - "eslint*"
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  # ------------------------------
  # 4. Docker
  # ------------------------------
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "monthly"
      day: "wednesday"
      time: "05:00"
      timezone: "Asia/Bangkok"
    open-pull-requests-limit: 3
    labels:
      - "dependencies"
      - "docker"
    commit-message:
      prefix: "chore(docker)"

  # ------------------------------
  # 5. GitHub Actions — รวมกลุ่ม
  # (ถ้าต้องการจัดกลุ่มทั้งหมดเป็น PR เดียว)
