version: 2

updates:
  # ============================================
  # Backend
  # ============================================
  - package-ecosystem: "npm"
    directory: "/backend"

    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Bangkok"

    open-pull-requests-limit: 10

    groups:

      nestjs:
        patterns:
          - "@nestjs/*"
        update-types:
          - "patch"
          - "minor"

      prisma:
        patterns:
          - "@prisma/*"
          - "prisma"
        update-types:
          - "patch"
          - "minor"

      build-tools:
        patterns:
          - "vite"
          - "vitest"
          - "typescript"
          - "@vitejs/*"
          - "eslint*"
        update-types:
          - "patch"
          - "minor"

      production-deps:
        dependency-type: "production"
        exclude-patterns:
          - "@nestjs/*"
          - "@prisma/*"
          - "prisma"
          - "vite"
          - "vitest"
          - "typescript"
        update-types:
          - "patch"
          - "minor"

      development-deps:
        dependency-type: "development"
        exclude-patterns:
          - "vite"
          - "vitest"
          - "typescript"
        update-types:
          - "patch"
          - "minor"

    ignore:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"

      # ป้องกัน Vite major jump
      - dependency-name: "vite"
        update-types:
          - "version-update:semver-major"

      - dependency-name: "@vitejs/*"
        update-types:
          - "version-update:semver-major"

    labels:
      - "dependencies"
      - "backend"

    commit-message:
      prefix: "chore(deps)"
      include: "scope"

    reviewers:
      - "zyntromedia"

    rebase-strategy: "auto"

  # ============================================
  # Root
  # ============================================
  - package-ecosystem: "npm"
    directory: "/"

    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Bangkok"

    open-pull-requests-limit: 5

    ignore:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"

    labels:
      - "dependencies"

    commit-message:
      prefix: "chore(deps)"

  # ============================================
  # GitHub Actions
  # ============================================
  - package-ecosystem: "github-actions"
    directory: "/"

    schedule:
      interval: "weekly"
      day: "monday"

    open-pull-requests-limit: 5

    groups:
      actions:
        patterns:
          - "*"

    labels:
      - "dependencies"
      - "github-actions"

    commit-message:
      prefix: "chore(ci)"
