name: Notify result
description: >-
  Summarise a run's outcome into the Job Summary and, if NOTIFY_WEBHOOK_URL is
  set, POST a short JSON payload to it. Never fails the pipeline when the
  webhook is unset or unreachable.

inputs:
  status:
    description: Result to report (usually needs.<job>.result)
    required: true
  title:
    description: Heading for the summary block
    required: false
    default: "Workflow result"
  message:
    description: Extra detail line
    required: false
    default: ""
    paths-ignore: 'Projects/**'

runs:
  using: composite
  steps:
    - name: Write job summary
      shell: bash
      run: |
        {
          echo "### ${{ inputs.title }}"
          echo ""
          echo "- Status: \`${{ inputs.status }}\`"
          if [ -n "${{ inputs.message }}" ]; then
            echo "- ${{ inputs.message }}"
          fi
        } >> "$GITHUB_STEP_SUMMARY"

    - name: Send webhook if configured
      shell: bash
      env:
        NOTIFY_WEBHOOK_URL: ${{ env.NOTIFY_WEBHOOK_URL }}
        STATUS: ${{ inputs.status }}
        TITLE: ${{ inputs.title }}
      run: |
        if [ -z "${NOTIFY_WEBHOOK_URL:-}" ]; then
          echo "NOTIFY_WEBHOOK_URL not set - skipping webhook (this is not a failure)."
          exit 0
        fi
        code=$(curl -s -o /dev/null -w '%{http_code}' -X POST "$NOTIFY_WEBHOOK_URL"           -H 'Content-Type: application/json'           -d "{\"title\":\"$TITLE\",\"status\":\"$STATUS\"}" || echo 000)
        echo "webhook responded $code"
        exit 0
