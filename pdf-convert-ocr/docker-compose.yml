services:
  ocr-cron:
    build: .
    command: >
      sh -c "
        while true; do
          # 📊 Daily summary report at 8 AM
          current_hour=\$(date +%H)
          if [ \$current_hour -eq 8 ]; then
            python -m src.api.scripts.daily-report
          fi
          
          # 🧹 Clean old temp files every hour
          node dist/cli/index.js cleanup --older-than 7d
          
          # 📈 Sync metrics every 15 min
          curl -X POST http://localhost/api/v1/admin/sync-metrics
          
          sleep 3600
        done
      "
    volumes:
      - ocr-data:/data
services:
  pdf-ocr:
    environment:
      # Email Monitor
      - IMAP_HOST=imap.gmail.com
      - IMAP_PORT=993
      - IMAP_USER=ocr@yourdomain.com
      - IMAP_PASS=your-app-password
      - EMAIL_CHECK_INTERVAL=30
      - EMAIL_MAX_SIZE_MB=50
      # Existing vars below
      - SMTP_HOST=...

      services:
  pdf-ocr:
    environment:
      # Email
      - SMTP_HOST=smtp.gmail.com
      - SMTP_PORT=587
      - SMTP_USER=your-email@gmail.com
      - SMTP_PASS=your-app-password
      - SMTP_FROM=your-email@gmail.com
      - ALERT_EMAIL=notify@yourdomain.com
      # Slack
      - SLACK_WEBHOOK=https://hooks.slack.com/services/XXX/YYY/ZZZ
