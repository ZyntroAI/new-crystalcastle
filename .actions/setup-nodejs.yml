name: Setup Node.js

on:
  workflow_call:

permissions:
  contents: read

jobs:
  setup-node:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Verify Node.js
        run: |
          node --version
          npm --version
