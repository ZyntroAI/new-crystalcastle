[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "nexus-research-tools"
version = "1.0.0"
description = "Research scripts, AI agent skills, and markdown analyzers."
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Nexus Team", email = "dev@example.com" }
]
dependencies = [
    "pydantic>=2.8.0",
    "pydantic-settings>=2.3.0",
    "requests>=2.32.0",
    "rich>=13.7.0"
]

[tool.ruff]
line-length = 88
select = ["E", "F", "I"]
ignore = ["E501"]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q"
testpaths = ["tests"]
