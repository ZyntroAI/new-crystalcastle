[pytest]
# Suites in this repo declare modules with colliding names (loader.py,
# test_suite.py) and import them with bare statements, so a single combined
# pytest run cannot collect them all. Run them per-suite instead:
#
#     python3 src/run_test_suites.py
#
# See docs/pytest-suites-isolation.md.
#
# testpaths is deliberately left unset: pass explicit paths, or use the runner.
addopts = -p no:cacheprovider
